<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS - Login</title>
  <meta name="theme-color" content="#060611">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            jarvis: { 400: '#1abbd7', 500: '#00b4d8', 600: '#0090ad' },
            dark: { 300: '#0e0e1f', 600: '#04040d', 700: '#020209' }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 12px rgba(0,180,216,0.5), inset 0 0 8px rgba(0,180,216,0.3); }
      50% { box-shadow: 0 0 24px rgba(0,180,216,0.8), inset 0 0 16px rgba(0,180,216,0.5); }
    }
  </style>
</head>
<body class="bg-dark-600 text-gray-200 h-screen flex items-center justify-center antialiased">
  <div class="w-full max-w-sm px-6">
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-full border-2 border-jarvis-500/60 flex items-center justify-center mb-4" style="animation: pulseGlow 2.5s ease-in-out infinite;">
        <div class="w-6 h-6 rounded-full bg-jarvis-500/40 border border-jarvis-500/50"></div>
      </div>
      <h1 class="text-2xl font-semibold tracking-[0.25em] text-jarvis-400">J.A.R.V.I.S.</h1>
      <p class="text-[10px] text-gray-500 tracking-widest uppercase mt-1">Autenticacao necessaria</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <input type="password" id="password" placeholder="Senha de acesso" autofocus autocomplete="current-password"
          class="w-full px-4 py-3 rounded-xl bg-dark-300/80 border border-white/10 text-gray-200 placeholder-gray-600 text-sm outline-none focus:border-jarvis-500/40 focus:shadow-[0_0_20px_rgba(0,180,216,0.08)] transition-all duration-300">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-jarvis-500 text-dark-700 font-medium text-sm hover:bg-jarvis-400 transition-all duration-200">
        Entrar
      </button>
      <p id="login-error" class="text-red-400 text-xs text-center hidden"></p>
    </form>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("login-error");
      errorEl.classList.add("hidden");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });

        if (res.ok) {
          window.location.href = "/";
        } else {
          const data = await res.json();
          errorEl.textContent = data.error || "Erro ao fazer login";
          errorEl.classList.remove("hidden");
        }
      } catch {
        errorEl.textContent = "Erro de conexao";
        errorEl.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
