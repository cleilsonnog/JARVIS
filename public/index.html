<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S.</title>
  <meta name="theme-color" content="#04040d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15/Sortable.min.js"></script>
</head>
<body class="bg-dark-600 text-gray-200 h-screen overflow-hidden antialiased">

  <!-- Futuristic background -->
  <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
    <!-- Grid -->
    <div class="absolute inset-0 bg-grid opacity-[0.03]"></div>
    <!-- Radial glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full bg-jarvis-500/[0.04] blur-[120px] animate-glow-drift"></div>
    <!-- Secondary glow -->
    <div class="absolute top-0 right-0 w-[400px] h-[400px] rounded-full bg-jarvis-500/[0.03] blur-[80px] animate-glow-drift-2"></div>
    <!-- Scan line -->
    <div class="scan-line absolute left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-jarvis-500/20 to-transparent"></div>
    <!-- Corner accents -->
    <svg class="absolute top-4 left-4 w-12 h-12 text-jarvis-500/10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M0 16V0h16"/><path d="M0 8V0h8"/>
    </svg>
    <svg class="absolute top-4 right-4 w-12 h-12 text-jarvis-500/10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M48 16V0H32"/><path d="M48 8V0h-8"/>
    </svg>
    <svg class="absolute bottom-4 left-4 w-12 h-12 text-jarvis-500/10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M0 32v16h16"/><path d="M0 40v8h8"/>
    </svg>
    <svg class="absolute bottom-4 right-4 w-12 h-12 text-jarvis-500/10" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M48 32v16H32"/><path d="M48 40v8h-8"/>
    </svg>
    <!-- Floating particles -->
    <div class="particle particle-1"></div>
    <div class="particle particle-2"></div>
    <div class="particle particle-3"></div>
    <div class="particle particle-4"></div>
    <div class="particle particle-5"></div>
    <div class="particle particle-6"></div>
  </div>

  <div id="app" class="flex h-screen relative z-10">

    <!-- Sidebar overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden transition-opacity duration-300"></div>

    <!-- Sidebar (hidden by default) -->
    <aside id="sidebar" class="fixed left-0 top-0 z-40 w-64 h-screen border-r border-white/5 bg-dark-700 flex flex-col transition-transform duration-300 -translate-x-full">
      <!-- Sidebar header -->
      <div class="p-3 border-b border-white/5 flex items-center gap-2">
        <button id="new-chat-btn" class="flex-1 flex items-center gap-2 px-3 py-2.5 rounded-xl border border-white/10 text-sm text-gray-300 hover:bg-jarvis-500/5 hover:border-jarvis-500/20 hover:text-jarvis-400 transition-all duration-200">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nova conversa
        </button>
        <button id="close-sidebar" class="p-2 rounded-lg text-gray-400 hover:text-jarvis-400 transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <!-- Conversation list -->
      <div id="conversation-list" class="flex-1 overflow-y-auto p-2 space-y-1">
      </div>
      <!-- Integrations (js/integrations.js) -->
      <div id="integrations" class="p-3 border-t border-white/5">
        <p class="text-[10px] font-mono uppercase tracking-wider text-gray-500 mb-2">Integrações</p>
        <div class="flex items-center gap-2 text-xs">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#fc4c02" aria-hidden="true"><path d="M15.39 17.94l-2.09-4.12h-3.07l5.16 10.18 5.15-10.18h-3.07M10.34 0L3.37 13.82h4.1l2.87-5.66 2.86 5.66h4.1z"/></svg>
          <span class="text-gray-300">Strava</span>
          <span id="strava-status" class="flex-1 truncate text-[11px] text-gray-500">…</span>
          <button type="button" id="strava-action" class="hidden px-2 py-1 text-[11px] border border-white/10 text-gray-300 hover:text-jarvis-400 hover:border-jarvis-500/40 transition-colors"></button>
        </div>
      </div>
    </aside>

    <!-- Main area -->
    <div class="flex flex-col flex-1 min-w-0">

      <!-- Header -->
      <header class="relative z-30 flex items-center justify-between px-3 sm:px-4 py-3 border-b border-white/5 backdrop-blur-sm bg-dark-600/80">
        <div class="flex items-center gap-3">
          <button id="toggle-sidebar" class="p-1.5 rounded-lg text-gray-400 hover:text-jarvis-400 transition-colors">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          </button>
          <button id="jarvis-home" class="flex items-center gap-3 hover:opacity-80 transition-opacity" title="Voltar ao inicio">
            <div class="w-9 h-9 rounded-full border-2 border-jarvis-500 animate-pulse-glow flex items-center justify-center">
              <div class="w-3 h-3 rounded-full bg-jarvis-500/60"></div>
            </div>
            <div class="text-left">
              <h1 class="text-lg font-semibold tracking-[0.15em] sm:tracking-[0.25em] text-jarvis-400">J.A.R.V.I.S.</h1>
              <p class="hidden sm:block text-[10px] text-gray-500 tracking-widest uppercase">Just A Rather Very Intelligent System</p>
            </div>
          </button>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2">
          <span class="hidden sm:inline-block w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.6)]"></span>
          <span class="hidden sm:inline text-xs text-gray-500">Online</span>
          <div class="relative sm:ml-2">
            <button id="agenda-btn" class="relative p-2 rounded-lg border border-white/10 text-gray-400 hover:text-jarvis-400 hover:border-jarvis-500/30 hover:bg-jarvis-500/5 transition-all duration-200" title="Lembretes">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>
              </svg>
              <span id="agenda-badge" class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-amber-400 text-[10px] font-semibold leading-4 text-dark-700 text-center"></span>
            </button>
            <div id="agenda-panel" class="hidden absolute right-0 top-full mt-2 max-sm:fixed max-sm:left-3 max-sm:right-3 max-sm:top-16 max-sm:w-auto z-50 w-80 max-w-[calc(100vw-1.5rem)] rounded-xl border border-jarvis-500/25 bg-dark-700 shadow-[0_0_30px_rgba(0,0,0,0.5)]">
              <div class="flex items-center gap-2 px-4 py-2.5 border-b border-white/5">
                <span class="hud-code">R-01</span><span class="hud-title">Lembretes</span>
              </div>
              <div id="agenda-panel-list" class="agenda space-y-3 p-3 max-h-[60vh] overflow-y-auto"></div>
            </div>
          </div>
          <button id="tts-btn" class="p-2 rounded-lg border border-white/10 text-gray-400 hover:text-jarvis-400 hover:border-jarvis-500/30 hover:bg-jarvis-500/5 transition-all duration-200" title="Ativar/desativar voz">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/>
              <path id="tts-waves" d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14"/>
            </svg>
          </button>
          <button id="theme-btn" class="p-2 rounded-lg border border-white/10 text-gray-400 hover:text-jarvis-400 hover:border-jarvis-500/30 hover:bg-jarvis-500/5 transition-all duration-200" title="Trocar tema">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Stage: conversation + voice view, with the JARVIS reactor behind (core.js) -->
      <div class="relative flex-1 min-h-0 flex flex-col">
        <div id="chat-reactor" aria-hidden="true"></div>

        <!-- Chat -->
        <main id="chat" class="relative z-10 flex-1 overflow-y-auto px-4 py-6 space-y-4 scroll-smooth">
          <!-- Dashboard rendered by js/dashboard.js -->
        </main>

        <!-- Voice view (while JARVIS speaks): the reactor is the visual; here only bars + "Ver texto" -->
        <div id="voice-indicator" class="relative z-10 hidden flex-1 flex-col items-center justify-end pb-6 animate-fade-in">
          <div class="flex items-center gap-1 mb-3">
            <span class="voice-bar w-1 bg-jarvis-500/80 rounded-full"></span>
            <span class="voice-bar w-1 bg-jarvis-500/80 rounded-full"></span>
            <span class="voice-bar w-1 bg-jarvis-500/80 rounded-full"></span>
            <span class="voice-bar w-1 bg-jarvis-500/80 rounded-full"></span>
            <span class="voice-bar w-1 bg-jarvis-500/80 rounded-full"></span>
            <span class="voice-bar w-1 bg-jarvis-500/80 rounded-full"></span>
            <span class="voice-bar w-1 bg-jarvis-500/80 rounded-full"></span>
          </div>
          <button id="voice-show-text" class="text-[11px] text-gray-500 hover:text-jarvis-400 transition-colors flex items-center gap-1">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            Ver texto
          </button>
        </div>
      </div>

      <!-- Input -->
      <footer class="px-4 pb-4 pt-2">
        <form id="input-form" class="relative flex items-end gap-3 p-2 rounded-2xl border border-white/10 bg-dark-300/80 backdrop-blur-sm focus-within:border-jarvis-500/40 focus-within:shadow-[0_0_20px_rgba(0,180,216,0.08)] transition-all duration-300">
          <!-- Upload -->
          <input type="file" id="file-input" class="hidden" accept=".pdf,.txt,.md,.js,.ts,.py,.json,.csv,.html,.css,.xml,.log,.yaml,.yml,.toml,.sql,.sh,.env,.jpg,.jpeg,.png,.gif,.webp,.bmp">
          <button type="button" id="upload-btn" class="p-2.5 rounded-xl border border-white/10 text-gray-400 hover:text-jarvis-400 hover:border-jarvis-500/30 hover:bg-jarvis-500/5 transition-all duration-200 flex-shrink-0" title="Enviar documento">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button type="button" id="camera-btn" class="p-2.5 rounded-xl border border-white/10 text-gray-400 hover:text-jarvis-400 hover:border-jarvis-500/30 hover:bg-jarvis-500/5 transition-all duration-200 flex-shrink-0" title="Câmera (visão do JARVIS)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
          <textarea id="input" placeholder="Mensagem para JARVIS..." rows="1" autofocus
            class="flex-1 bg-transparent text-gray-200 placeholder-gray-600 px-3 py-2.5 text-sm resize-none max-h-36 outline-none"></textarea>
          <button type="button" id="mic-btn" class="p-2.5 rounded-xl border border-white/10 text-gray-400 hover:text-jarvis-400 hover:border-jarvis-500/30 hover:bg-jarvis-500/5 transition-all duration-200 flex-shrink-0" title="Falar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="9" y="1" width="6" height="11" rx="3"/>
              <path d="M19 10v1a7 7 0 01-14 0v-1"/>
              <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button type="submit" id="send-btn" class="p-2.5 rounded-xl bg-jarvis-500 text-dark-700 hover:bg-jarvis-400 disabled:opacity-30 disabled:cursor-not-allowed transition-all duration-200 flex-shrink-0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </form>
        <p class="text-center text-[10px] text-gray-600 mt-2">JARVIS usa Gemini 2.5 Flash &middot; As respostas podem conter erros</p>
      </footer>
    </div>

    <!-- Reminder cards container -->
    <div id="reminder-cards" class="fixed bottom-20 right-4 z-50 flex flex-col-reverse gap-3 max-h-[60vh] overflow-hidden pointer-events-none">
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
